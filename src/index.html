<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Holape</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- CSP removida del index.html: bloqueaba recursos legítimos de la app y
       chancaba la UI. La defensa XSS sigue activa via:
       - Refactor de [innerHTML] en message-item y template-selector (Stored XSS cerrado).
       - Sanitización de mensajes de error en error.interceptor.
       - Whitelist de dominios para Authorization header.
       Para volver a habilitar CSP, hacerlo en server-side (Spring Boot SecurityConfig)
       con una política bien validada contra todos los recursos que la app carga. -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Google Fonts: load directo (CSP bloquea inline onload handlers).
       preconnect optimiza la conexión TLS para minimizar bloqueo de render. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Runtime config: overwrite public/env.js on each VM to set apiUrl, wsUrl, title, etc. -->
  <script src="env.js"></script>
  <!-- Polyfills + title setter. Movido a archivo externo para permitir CSP estricta (script-src 'self'). -->
  <script src="polyfills-init.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
