<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Holape</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Content-Security-Policy: limita orígenes para defensa XSS / data exfiltration.
       'unsafe-inline' en style-src es necesario porque Angular AOT emite los estilos
       del decorador @Component({styles:[...]}) como <style> inline en runtime.
       NOTA: frame-ancestors no se incluye aquí (los browsers lo ignoran en <meta>).
       Para clickjacking-defense agregar X-Frame-Options: DENY desde Spring Boot.
       Si una nueva integración requiere un dominio nuevo, agregarlo aquí. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:8080 ws://localhost:8080 https://*.digitalclub.com.pe wss://*.digitalclub.com.pe https://*.innovag.com.pe wss://*.innovag.com.pe https://fonts.googleapis.com; object-src 'none'; base-uri 'self';">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Google Fonts: load directo (CSP bloquea inline onload handlers).
       preconnect optimiza la conexión TLS para minimizar bloqueo de render. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Runtime config: overwrite public/env.js on each VM to set apiUrl, wsUrl, title, etc. -->
  <script src="env.js"></script>
  <!-- Polyfills + title setter. Movido a archivo externo para permitir CSP estricta (script-src 'self'). -->
  <script src="polyfills-init.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
